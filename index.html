
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini 中文版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- PDF.js for client-side text extraction (Sync load) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Configure PDF.js worker
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gemini: {
                primary: '#1a73e8', // Google Blue
                secondary: '#a142f4',
                surface: '#ffffff',
                background: '#f8f9fa',
                text: '#202124',
                border: '#dadce0'
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f8f9fa;
        color: #202124;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      /* Custom Scrollbar for Light Theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #dadce0;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bdc1c6;
      }
      .gemini-gradient-text {
        background: linear-gradient(74deg, #4285f4 0%, #9b72cb 9%, #d96570 20%, #d96570 24%, #9b72cb 35%, #4285f4 44%, #9b72cb 50%, #d96570 56%, #202124 75%, #202124 100%);
        background-size: 400% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradient 10s linear infinite;
      }
      @keyframes gradient {
        0% { background-position: 100% 0%; }
        100% { background-position: -100% 0%; }
      }
      
      @media print {
        @page { 
          margin: 1cm;
          size: auto; 
        }
        body { 
          background: white !important; 
          height: auto !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        html, #root {
          height: auto !important;
          overflow: visible !important;
        }
        /* Override tailwind hidden logic if needed */
        .print\:hidden { display: none !important; }
        .print\:block { display: block !important; }
        .print\:visible { visibility: visible !important; }
        .print\:w-full { width: 100% !important; }
        .print\:h-auto { height: auto !important; }
        .print\:overflow-visible { overflow: visible !important; }
        
        /* Specific Fixes */
        .markdown-body pre {
           white-space: pre-wrap !important;
           word-break: break-all !important;
        }
        .whitespace-pre-wrap {
           white-space: pre-wrap !important;
        }
        
        /* Hide scrollbars in print */
        ::-webkit-scrollbar { display: none; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.1",
    "uuid": "https://esm.sh/uuid@^13.0.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
